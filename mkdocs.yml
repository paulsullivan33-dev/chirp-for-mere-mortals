site_name: CHIRP for Mere Mortals
site_description: Programming amateur radios from a computer instead of their front panels. Downloading a radio's memory to a file, building a channel plan you can read and check by hand, and writing it back to the radio, with the licensing rules and the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/chirp-for-mere-mortals/
